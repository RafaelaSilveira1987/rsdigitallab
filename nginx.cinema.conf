server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # A página principal não requer rotas de servidor.
    location / { try_files $uri $uri/ =404; }

    # Vídeo e imagens locais com cache, preservando os headers do Nginx.
    location ~* \.(mp4|webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location ~* \.(css|js)$ { expires 1h; try_files $uri =404; }
}
